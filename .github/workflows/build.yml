name: Build Windows Installer from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $zip) { throw "Repository root-এ কোনো zip ফাইল পাওয়া যায়নি" }
          Write-Host "Using: $($zip.Name)"
          $dest = Join-Path $env:RUNNER_TEMP "proj"
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $pkg = Get-ChildItem -Path $dest -Recurse -Filter package.json -File |
                 Where-Object { $_.FullName -notmatch 'node_modules' } |
                 Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $pkg) { throw "zip-এর ভিতরে package.json পাওয়া যায়নি" }
          $dir = $pkg.DirectoryName -replace '\\','/'
          "PROJECT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
